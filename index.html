<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04040F">
<meta name="color-scheme" content="dark">
<title>The LearnOps Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Retro palette pulled from the Session 513 deck: navy 0B0B24, lime CEFF59, purple 5F51CA, magenta FA1DF8 */
:root{
  color-scheme:dark;
  --bg:#04040F; --panel:#0B0B24; --panel2:#14143A; --ink:#EEEDFB; --muted:#B3B0DC; --soft:#9D93F0;
  --gold:#CEFF59; --sage:#CEFF59; --red:#FA1DF8; --purple:#5F51CA;
  --line:#3A3A52; --field:#04040F; --shadow:#5F51CA;
  --sky1:#0B0B24; --sky2:#2A1F5C; --hill:#2A2466; --hill2:#1B1845; --trail:#CEFF59; --river:#7B6FF0;
  --wagon:#EEEDFB; --cover:#EEEDFB;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.125rem;line-height:1.5;font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;
  background-image:radial-gradient(circle at 50% -10%,#1A1550 0,transparent 60%);background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h2,.disp{font-family:"Pixelify Sans","Trebuchet MS",Verdana,sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:2.3rem;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;text-shadow:3px 3px 0 var(--purple)}
h2{font-size:1.45rem;margin:0 0 10px;color:var(--ink)}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.gold{color:var(--gold)} .sage{color:var(--sage)} .red{color:var(--red)}

/* blinking cursor after the question that sits right above the choices */
@keyframes blink{50%{opacity:0}}
p:has(+ .choices)::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:6px;vertical-align:-3px;background:var(--gold);animation:blink 1s steps(1) infinite}

/* HUD: the status bar */
.hud{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:5;display:flex;align-items:center;gap:10px;justify-content:space-between;border:2px solid var(--purple);background:var(--panel);padding:7px 12px;box-shadow:4px 4px 0 #000;font-family:"Pixelify Sans",sans-serif;font-weight:500}
.hud[hidden]{display:none}
.hud .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;color:var(--soft);text-transform:uppercase;font-size:1rem;letter-spacing:.04em}
.hud .hrs{font-weight:700;white-space:nowrap;color:var(--gold);font-size:1.2rem}
.hud .hrs.neg{color:var(--red)}
.stamps{display:flex;gap:4px}
.stamps i{display:block;width:16px;height:16px;border:2px solid var(--soft)}
.stamps i.on{background:var(--gold);border-color:var(--gold)}
.stamps i.pop{animation:pop .6s steps(4)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.8)}100%{transform:scale(1)}}
.hud .hrs.bump{animation:pop .5s steps(3)}

/* Scene: the travel screen */
.scene{position:relative;margin:12px 0 0;border:2px solid var(--purple);box-shadow:4px 4px 0 #000;background:var(--sky1);overflow:hidden}
.scene svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#wagon{transition:transform 1.4s steps(14)}
#wagon.roll .bob{animation:bob .35s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-1px)}}
.twinkle{animation:blink 2.4s steps(1) infinite}
.twinkle.b{animation-delay:1.2s}

/* Panel */
.panel{margin-top:12px;border:2px solid var(--purple);background:var(--panel);padding:18px 16px 20px;box-shadow:4px 4px 0 #000;position:relative}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);pointer-events:none}
.where{font-family:"Pixelify Sans",sans-serif;font-weight:500;font-size:.95rem;color:var(--soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.choices{display:grid;gap:10px;margin-top:8px}
button{font:inherit;color:inherit;cursor:pointer}
.choice,.go{display:block;width:100%;min-height:52px;text-align:left;background:var(--panel2);border:2px solid var(--purple);padding:12px 14px;box-shadow:3px 3px 0 #000;transition:transform .08s,box-shadow .08s,border-color .08s;position:relative}
.choice{display:flex;gap:10px;align-items:baseline;color:var(--ink)}
.choice b{color:var(--gold);font-family:"Pixelify Sans",sans-serif;font-weight:700;flex:none;min-width:1.4em}
.go{background:var(--gold);color:var(--panel);border-color:var(--gold);text-align:center;font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:1.2rem;margin-top:16px;text-transform:uppercase;letter-spacing:.04em}
.ghost{background:transparent;border:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted);padding:12px 0;min-height:44px;margin-top:4px;font-size:1rem}
@media (hover:hover){
  .choice:hover{border-color:var(--gold);transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000}
  .go:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--purple)}
  .ghost:hover,.foot button:hover{color:var(--gold)}}
.choice:active,.go:active{transform:translate(3px,3px);box-shadow:none}
.choice:focus-visible{border-color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{border:2px dashed var(--line);padding:12px 14px;margin:14px 0}
.box p:last-child{margin-bottom:0}
.tag{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.04em}
.cost{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:1.4rem}

/* Forms */
label{display:block;margin:16px 0 6px;font-weight:700}
label small{display:block;color:var(--muted);font-size:.95rem;line-height:1.35;font-weight:400;margin-top:2px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--field);border:2px solid var(--purple);padding:10px;border-radius:0;-webkit-appearance:none;appearance:none;caret-color:var(--gold)}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
select option{background:var(--panel);color:var(--ink)}
.row{border-top:2px solid var(--line);margin-top:16px;padding-top:2px}
.live{border:2px solid var(--line);border-left-width:8px;padding:10px 12px;margin-top:14px;background:var(--bg)}
.live.ok{border-color:var(--sage)} .live.no{border-color:var(--red)}
pre{font:inherit;white-space:pre-wrap;word-break:break-word;margin:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.scale button{border:2px solid var(--purple);background:var(--panel2);color:var(--ink);padding:10px 0;min-height:48px;font-size:1.2rem;font-family:"Pixelify Sans",sans-serif;font-weight:700}
.scale button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--panel)}
.timer{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:3.4rem;text-align:center;color:var(--red);margin:4px 0;text-shadow:3px 3px 0 #000}
.tomb{display:block;margin:4px auto 10px;width:150px;height:auto;shape-rendering:crispEdges}
.foot{margin-top:20px;font-size:.9rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px 16px;flex-wrap:wrap}
.foot button{background:none;border:0;padding:10px 0;min-height:44px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.score{border:2px solid var(--gold);background:var(--bg);padding:14px;margin:14px 0;text-align:center;box-shadow:4px 4px 0 var(--purple)}
.score .big{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:3.4rem;line-height:1;color:var(--gold);text-shadow:3px 3px 0 var(--purple)}
.score table{width:100%;border-collapse:collapse;margin-top:12px;text-align:left}
.score td{padding:5px 0;border-top:2px dotted var(--line)} .score td:last-child{text-align:right;font-family:"Pixelify Sans",sans-serif;font-weight:700;color:var(--gold)}
.entry{display:grid;grid-template-columns:3.2rem 1fr 6.5rem;gap:6px;align-items:center;margin-top:6px}
.entry span{font-family:"Pixelify Sans",sans-serif;font-weight:700;color:var(--soft)}
.rank{display:grid;grid-template-columns:2.6rem 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:2px solid var(--line)}
.rank .pos{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:1.6rem}
.rank .bar{height:10px;background:var(--gold);margin-top:4px}
.rank .pts{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:1.5rem}
.rank.top .pos,.rank.top .pts{color:var(--gold)}
body.present .wrap{max-width:900px} body.present .rank{font-size:1.9rem} body.present .rank .pts,body.present .rank .pos{font-size:2.4rem}
.arena{position:relative;height:300px;overflow:hidden;border:2px solid var(--purple);background:var(--bg);touch-action:manipulation;margin-top:6px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.chip{position:absolute;left:0;white-space:nowrap;border:2px solid var(--soft);background:var(--panel2);color:var(--ink);padding:9px 11px;font-size:1rem;font-weight:700;box-shadow:2px 2px 0 #000;animation:fly 4.2s linear forwards}
.chip.got{background:var(--gold);border-color:var(--gold);color:var(--panel);animation-play-state:paused}
@keyframes fly{from{transform:translateX(-100%)}to{transform:translateX(660px)}}
.lock{display:block;margin:0 auto 10px;width:84px;height:auto;shape-rendering:crispEdges}
.how li{margin:0 0 10px;padding-left:4px}
.how ol{padding-left:1.4em;margin:0 0 12px}
.how li::marker{color:var(--gold);font-family:"Pixelify Sans",sans-serif;font-weight:700}
.trailev{border:2px solid var(--line);border-left:8px solid var(--soft);padding:10px 12px;margin:0 0 14px;background:var(--bg)}
.trailev.bad{border-left-color:var(--red)} .trailev.good{border-left-color:var(--sage)}
.trailev p{margin:0}
.grave{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;padding:6px 0;border-top:2px dotted var(--line)}
.kit{max-height:50vh;overflow:auto;border:2px solid var(--purple);background:var(--bg);padding:12px;font-family:"VT323","Courier New",ui-monospace,monospace;font-size:1.25rem;line-height:1.25;color:var(--gold)}
/* Numbers use VT323: in Pixelify Sans a 2 reads like 8 and a 5 like S, risky on a projector */
.num,.where,.tag,.cost,.timer,.disp,.hud .hrs,.score .big,.score td:last-child,.rank .pos,.rank .pts,.entry span,.scale button,.choice b,#board h2{font-family:"VT323","Courier New",ui-monospace,monospace;font-weight:400}
.where{font-size:1.3rem;letter-spacing:.06em;line-height:1.1}
.tag{font-size:1.3rem;letter-spacing:.03em}
.cost{font-size:1.9rem}
.timer{font-size:4.6rem;line-height:1}
.disp{font-size:1.7rem !important}
.hud .hrs{font-size:1.6rem}
.score .big{font-size:4.6rem}
.score td:last-child{font-size:1.5rem}
.rank .pos{font-size:2.1rem} .rank .pts{font-size:2rem}
body.present .rank .pts,body.present .rank .pos{font-size:3.2rem}
.entry span{font-size:1.4rem}
.scale button{font-size:1.6rem}
.choice b{font-size:1.45rem;line-height:1}
#board h2{font-size:2.2rem}
.how li::marker{font-family:"VT323",monospace;font-weight:400;font-size:1.3rem}
/* Hold it up: full-screen score for the stand-and-sit scoring on slide 10 */
.go.alt{background:transparent;color:var(--gold);border-color:var(--gold)}
.holdup{position:fixed;inset:0;z-index:50;background:var(--panel);border:6px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.hu-t{font-family:"VT323","Courier New",monospace;font-size:min(18vw,12vh);line-height:1;color:var(--ink)}
.hu-p{font-family:"VT323","Courier New",monospace;font-size:min(48vw,32vh);line-height:.9;color:var(--gold);text-shadow:6px 6px 0 var(--purple);margin:8px 0}
.hu-l{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:min(8vw,6vh);text-transform:uppercase;letter-spacing:.06em}
.hu-x{margin-top:28px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:1rem;min-height:44px}
.late{text-align:center;margin:10px 0 0;font-size:1rem}
@media (prefers-reduced-motion: reduce){
  #wagon{transition:none}#wagon.roll .bob,.chip,.twinkle,.stamps i.pop,.hud .hrs.bump,p:has(+ .choices)::after{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud" id="hud" hidden>
    <span class="name" id="hudName"></span>
    <span class="stamps" id="hudStamps" aria-label="Stamps collected"></span>
    <span class="hrs" id="hudHrs"></span>
  </div>

  <figure class="scene" aria-hidden="true">
    <svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0B24"/><stop offset="1" stop-color="#2A1F5C"/></linearGradient></defs>
      <rect width="320" height="110" fill="url(#sky)"/>
      <!-- stars and moon -->
      <g fill="#EEEDFB"><rect x="20" y="10" width="2" height="2"/><rect x="58" y="22" width="2" height="2" class="twinkle"/><rect x="96" y="8" width="2" height="2"/><rect x="140" y="18" width="2" height="2" class="twinkle b"/><rect x="186" y="6" width="2" height="2"/><rect x="214" y="26" width="2" height="2" class="twinkle"/><rect x="300" y="12" width="2" height="2" class="twinkle b"/></g>
      <g fill="#CEFF59"><rect x="120" y="30" width="2" height="2" class="twinkle b"/><rect x="236" y="14" width="2" height="2"/></g>
      <rect x="262" y="12" width="14" height="14" fill="#EEEDFB"/><rect x="268" y="12" width="8" height="8" fill="#0B0B24"/>

      <rect x="108" y="66" width="2" height="10" fill="#EEEDFB"/><rect x="110" y="66" width="8" height="5" fill="#FA1DF8"/>
      <!-- signpost at wagon check -->

      <!-- Oregon flag -->

      <g id="wagon" transform="translate(6,0)"><g class="bob">
        <rect x="2" y="78" width="20" height="9" fill="#EEEDFB"/><rect x="4" y="76" width="16" height="2" fill="#EEEDFB"/>
        <rect x="0" y="87" width="24" height="5" fill="#CEFF59"/>

    </svg>
  </figure>

  <main class="panel" id="panel" aria-live="polite"></main>

  <div class="foot">
    <span>The Learning Ops Starter Kit. Sandie Dela Cruz, The Human Catalyst.</span>
    <span><button type="button" id="soundBtn" aria-pressed="false">Sound: off</button> &nbsp; <button type="button" id="bossLink">Leaderboard (trail boss)</button> &nbsp; <button type="button" id="restart">Start over</button></span>
  </div>

<script>
(function(){
"use strict";
var KEY="learnops-trail-v1",BKEY="learnops-trail-board-v1";
var B={n:15,rows:{},top:true,hide:false};
try{var rb=localStorage.getItem(BKEY);if(rb){var ob=JSON.parse(rb);if(ob&&ob.rows)B=Object.assign(B,ob);}}catch(e){}
function saveB(){try{localStorage.setItem(BKEY,JSON.stringify(B));}catch(e){}}
var fresh=function(){return {step:0,hours:40,name:"",party:"",check:[0,0,0,0,0],stamps:[0,0,0,0,0],pick:{},
  t1:{who:"",what:"",problem:"",success:"",when:""},
  t2:{project:"",sponsor:"",status:"On track",done:"",next:"",ask:"",by:"",me:""},
  t3:[{req:"",owner:"",status:"In progress",outcome:""},{req:"",owner:"",status:"In progress",outcome:""},{req:"",owner:"",status:"In progress",outcome:""}],
  t4:{what:"",place:"",r1:"",r2:"",approver:"",rev:[{n:"",j:""},{n:"",j:""},{n:"",j:""}]},
  t5:{project:"",plan:"",slow:"",again:"",change:"",owner:"",tpl:""},
  fort:"",monday:"",table:"",crew:0,cast:{ask:"",sme:"",mate:""},ev:{},hunt:null,epitaph:"",mode:"",open:{},gateNext:0};};
var S=fresh();
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o.step==="number"){S=Object.assign(fresh(),o);if(!S.cast)S.cast={ask:"",sme:"",mate:""};if(!S.ev)S.ev={};if(!S.open)S.open={};}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var $=function(id){return document.getElementById(id);};
var panel=$("panel"),timer=null;

var TPL=["Request form","Status update","Project tracker","Review plan","Lessons learned"];
var WAGON_X=[6,6,6,22,22,22,100,100,100,160,160,160,204,204,204,238,262,286,286,290,290];

function spend(n,why){S.hours-=n;}
function hud(){
  $("hud").hidden=S.step<2||S.step===99||S.step===40;
  $("hudName").textContent=(S.name||"Your wagon");
  var h=$("hudHrs");h.textContent=S.hours+" hrs";h.className="hrs"+(S.hours<0?" neg":"");

  var seq={tap:[[660,.05]],stamp:[[523,.08],[659,.08],[784,.08],[1047,.18]],gate:[[392,.08],[523,.08],[784,.18]],no:[[150,.2]]}[kind]||[[660,.05]];

/* ---------- events ---------- */
panel.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;

  if(b.dataset.chip){if(b.classList.contains("got"))return;b.classList.add("got");b.textContent="Yes!";S.hunt=S.hunt||{yes:0};S.hunt.yes++;setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},350);return;}

    o.addEventListener("click",function(){if(o.parentNode)o.parentNode.removeChild(o);var hb=$("holdUp");if(hb)hb.focus();});document.body.appendChild(o);o.querySelector(".hu-x").focus();sfx("gate");return;}
  if(b.id==="bBack"){go(S.prev||0);return;}

  if(b.id==="bHide"){B.hide=!B.hide;saveB();board();return;}
  if(b.id==="bClear"){if(window.confirm("Clear every score on the board?")){B.rows={};saveB();render();}return;}
  if(b.id==="gateGo"){var v=norm(($("gateIn")||{}).value),i=GATES[S.gateNext],ok=false;try{ok=(v===atob(GW[i])||v===atob(GM));}catch(e1){}
    if(ok){S.open[i]=1;sfx("gate");go(S.gateNext);}else{sfx("no");var gm=$("gateMsg");gm.style.display="block";gm.textContent=v?"That is not the word. Check the big screen, or ask a neighbor.":"Type the trail word from the big screen.";}return;}
  if(b.id==="copyKit"){var txt=kitText(),msg=$("copyMsg");msg.style.display="block";

        fail=function(){msg.className="live no";msg.textContent="Your browser blocked the copy. Press and hold the text above, choose Select all, then Copy. Or take a screenshot.";};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){legacy();});}else legacy();}catch(err){legacy();}
